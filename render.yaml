# Render Blueprint: one free web service (Docker) + one free Postgres.
# In Render: New -> Blueprint -> pick this repo and the `deploy` branch.
services:
  - type: web
    name: smart-kiosk
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/products
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-kiosk-db
          property: connectionString
      - key: WEBHOOK_SECRET # read it in the Render dashboard to run send-webhook against the live app
        generateValue: true
      - key: NODE_ENV # production: secure cookies, and the app refuses to start without real secrets
        value: production
      - key: ADMIN_EMAIL # first admin login for /admin
        value: admin@kiosk.local
      - key: ADMIN_PASSWORD # generated; read it in the Render dashboard (Environment tab)
        generateValue: true
      - key: ENABLE_PAYMENT_SIMULATOR # demo: lets the QR page / Simulate button pay (fake money)
        value: "true"
      - key: SEED_DEMO_DATA # demo: on first start, add sample kiosks, staff roster and a week of sales
        value: "true"     # (marked as sample everywhere; sample staff get random passwords)

databases:
  - name: smart-kiosk-db
    plan: free # note: Render's free Postgres expires 30 days after creation
    region: singapore
    databaseName: pickup
    postgresMajorVersion: "16"
