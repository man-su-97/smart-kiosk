services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pickup
    ports:
      - "5432:5432"
    volumes:
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pickup"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped # come back by itself if it ever exits
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/pickup
      WEBHOOK_SECRET: dev-webhook-secret
      ENABLE_PAYMENT_SIMULATOR: "true" # demo only, see README
      # Demo logins for the /admin portal (created at start if missing)
      ADMIN_EMAIL: admin@kiosk.local
      ADMIN_PASSWORD: admin12345
      STAFF_EMAIL: staff@kiosk.local
      STAFF_PASSWORD: staff12345
      DEMO_STAFF_PASSWORD: demo12345   # sample staff from `npm run seed-demo` (local only)
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      API_TARGET: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      - api
